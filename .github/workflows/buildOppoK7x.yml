name: Build(rsuntk KSU legacy + Hooks) Oppo K7x MT6853

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5' # 每周五凌晨运行一次

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 构建编译内核环境
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex \
          libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
          python3 python-is-python3 binutils binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5 libncursesw5-dev rsync patch

    - name: 下载 GCC 工具链 (Google 4.9)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace || mkdir -p $GITHUB_WORKSPACE/kernel_workspace && cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc64 gcc32
        wget -qO gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -xzf gcc-aarch64.tar.gz
        wget -qO gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -xzf gcc-arm.tar.gz

    - name: 下载 Clang 工具链 (crDroid clang-10)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/wu17481748/android_kernel_mtk6853 android-kernel
        cd android-kernel

    - name: 集成 rsuntk KernelSU 新版 + 最小化钩子
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        # ... 前面的清理、克隆 v3.0.0-30-legacy、路径链接、pgtable.h 修复、dos2unix 乱码修复 保持不变
        
        # 清理旧注入（非常重要，防止多次运行积累垃圾代码）
        sed -i '/ksu_handle/d' fs/*.c kernel/*.c || true
        
        # fs/exec.c - do_execveat_common 函数体开头
        sed -i '/int do_execveat_common/,/{/ { /{/ a \
    #ifdef CONFIG_KSU\n    extern int ksu_handle_execveat(int *fd, struct filename **filename, void *argv, void *envp, int *flags);\n    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n    #endif
        }' fs/exec.c || true
        
        # fs/open.c - do_faccessat 函数体开头
        sed -i '/long do_faccessat/,/{/ { /{/ a \
    #ifdef CONFIG_KSU\n    extern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\n    if (ksu_handle_faccessat(&dfd, &filename, &mode, &flags)) return -EACCES;\n    #endif
        }' fs/open.c || true
        
        # fs/stat.c - vfs_fstatat 函数体开头
        sed -i '/int vfs_fstatat/,/{/ { /{/ a \
    #ifdef CONFIG_KSU\n    extern int ksu_handle_stat(int *dfd, const char __user **filename, int *flags);\n    ksu_handle_stat(&dfd, &filename, &flags);\n    #endif
        }' fs/stat.c || true
        
        # 可选：如果你的 stat 用的是 __do_sys_newfstatat，也加一个
        sed -i '/int __do_sys_newfstatat/,/{/ { /{/ a \
    #ifdef CONFIG_KSU\n    extern int ksu_handle_newfstatat(int dfd, const char __user *filename, struct stat *statbuf, int flag);\n    if (ksu_handle_newfstatat(dfd, filename, statbuf, flag)) return -EACCES;\n    #endif
        }' fs/stat.c || true
        
        # kernel/reboot.c - SYSCALL_DEFINE4(reboot) 函数体开头
        sed -i '/SYSCALL_DEFINE4(reboot/,/{/ { /{/ a \
    #ifdef CONFIG_KSU\n    extern int ksu_handle_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);\n    if (ksu_handle_reboot(magic1, magic2, cmd, arg)) return -EINVAL;\n    #endif
        }' kernel/reboot.c || true
        
        # 统一在 fs/exec.c 开头加 extern 声明（避免重复声明警告）
        sed -i '1i #ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename, void *argv, void *envp, int *flags);\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\nextern int ksu_handle_stat(int *dfd, const char __user **filename, int *flags);\nextern int ksu_handle_newfstatat(int dfd, const char __user *filename, struct stat *statbuf, int flag);\nextern int ksu_handle_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);\n#endif\n' fs/exec.c || true
        
        # 调试：打印注入后的代码片段，看看是否正确插入到 { 后面
        echo "=== fs/exec.c do_execveat_common 附近代码 ==="
        grep -A 15 "do_execveat_common" fs/exec.c || echo "未找到 do_execveat_common"
        echo "=== fs/open.c do_faccessat 附近 ==="
        grep -A 10 "do_faccessat" fs/open.c || echo "未找到 do_faccessat"

    - name: 设置 ccache 缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: mtk6853-new-ksu-minhook-${{ github.sha }}
        max-size: 3G

    - name: 配置内核并开启 KSU（修复 scripts/config 调用）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        # 生成初始 .config
        make O=out mt6853-ss_defconfig

        # 调试：检查 .config 是否生成
        ls -l out/.config || { echo "ERROR: out/.config not found!"; exit 1; }
        head -n 20 out/.config  # 打印前20行看是否正常

        # 用 bash 显式调用 scripts/config，一次性设置所有开关
        bash scripts/config --file out/.config \
          --enable CONFIG_KSU \
          --enable CONFIG_KSU_MANUAL_HOOK \
          --enable CONFIG_MODULES \
          --disable CONFIG_KSU_USE_KPROBES \
          --disable CONFIG_KPROBES \
          --disable CONFIG_KPROBE_EVENTS \
          --disable CONFIG_HAVE_KPROBES

        # 如果上面失败，再 fallback 单条设置（逐个）
        # bash scripts/config --file out/.config --enable CONFIG_KSU || echo "Failed to enable CONFIG_KSU"
        # ... 类似其他

        # 刷新配置 + 调试输出
        make O=out olddefconfig
        grep -E 'CONFIG_KSU|CONFIG_MODULES|KPROBE' out/.config || echo "KSU config not set! Check scripts/config"

        # 可选：如果还是问题，加 --keep-case
        # bash scripts/config --keep-case --file out/.config --enable CONFIG_KSU ...

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=coolapk@三笆
        export KBUILD_BUILD_USER=GitHub@sanba0519

        make -s -j$(nproc --all) O=out mt6853-ss_defconfig
        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld \
          Image.gz-dtb 2>&1 | tee build.log || { tail -n 100 build.log; exit 1; }

    - name: 制作 AnyKernel3 卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
        echo 'cmdline+=" androidboot.selinux=permissive"' >> anykernel.sh
        cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
        rm -rf .git* README.md .github

    - name: 上传 AnyKernel3 卡刷包
      uses: actions/upload-artifact@v4
      with:
        name: OPPO-Realme-MT6853-NewKSU-MinHook-AnyKernel3
        path: kernel_workspace/AnyKernel3/*

    - name: 上传原始 Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: MT6853-NewKSU-Image.gz-dtb
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb
    - name: 上传 .config 调试
      uses: actions/upload-artifact@v4
      with:
        name: kernel-config-debug
        path: kernel_workspace/android-kernel/out/.config