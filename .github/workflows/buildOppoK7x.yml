name: Build(rsuntk KSU legacy + Hooks) Oppo K7x MT6853

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 构建编译内核环境
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex \
          libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
          python3 python-is-python3 binutils binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5 libncursesw5-dev rsync patch

    - name: 下载 GCC 工具链 (Google 4.9)
      run: |
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace && cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc64 gcc32
        wget -qO gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -xzf gcc-aarch64.tar.gz -C gcc64/
        wget -qO gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -xzf gcc-arm.tar.gz -C gcc32/

    - name: 下载 Clang 工具链 (crDroid clang-10)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/wu17481748/android_kernel_mtk6853 android-kernel

    - name: 集成 rsuntk KernelSU 并注入钩子
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        # 1. 彻底准备目录结构
        rm -rf drivers/kernelsu KernelSU
        git clone --depth=1 https://github.com/rsuntk/KernelSU drivers/kernelsu -b v3.0.0-30-legacy
        
        # [关键修复]：rsuntk legacy 的文件都在 kernel/ 目录下，我们需要把它们移出来或者建立软链接
        # 这里采用物理移动方案，确保 Kconfig 就在 drivers/kernelsu/ 目录下
        cd drivers/kernelsu
        cp kernel/Kconfig .
        cp kernel/Makefile .
        cd ../..
        
        # 2. 注入 Kconfig 和 Makefile
        sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile || true
        sed -i '1i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        sed -i '1i obj-y += kernelsu/' drivers/Makefile

        # 3. 源码清理与钩子注入
        find drivers/soc/oplus drivers/nfc drivers/misc -name "Kconfig*" -exec dos2unix {} \; || true
        sed -i '/ksu_handle/d' fs/*.c kernel/*.c || true
        
        # [注入钩子逻辑]
        sed -i '1i #ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
        sed -i '/do_execveat_common(int fd/,/^{/ s/^{/{\n#ifdef CONFIG_KSU\n    ksu_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\n#endif/' fs/exec.c
        
        sed -i '1i #ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\n#endif' fs/open.c
        sed -i 's/int flags = 0;/int flags = 0;\n#ifdef CONFIG_KSU\n    ksu_handle_faccessat(\&dfd, \&filename, \&mode, \&flags);\n#endif/' fs/open.c

        sed -i '1i #ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename, int *flags);\nextern int ksu_handle_newfstatat(int dfd, const char __user *filename, struct stat *statbuf, int flag);\n#endif' fs/stat.c
        sed -i '/vfs_fstatat(int dfd/,/^{/ s/^{/{\n#ifdef CONFIG_KSU\n    ksu_handle_stat(\&dfd, \&filename, \&flag);\n#endif/' fs/stat.c
        sed -i '/SYSCALL_DEFINE4(newfstatat, int, dfd/,/^{/ s/^{/{\n#ifdef CONFIG_KSU\n    ksu_handle_newfstatat(dfd, filename, NULL, flag);\n#endif/' fs/stat.c

        sed -i '1i #ifdef CONFIG_KSU\nextern int ksu_handle_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);\n#endif' kernel/reboot.c
        sed -i '/SYSCALL_DEFINE4(reboot/,/^{/ s/^{/{\n#ifdef CONFIG_KSU\n    ksu_handle_reboot(magic1, magic2, cmd, arg);\n#endif/' kernel/reboot.c

    - name: 设置 ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: mtk6853-ksu-v3-legacy
        max-size: 3G

    - name: 配置内核并开启 KSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        make O=out mt6853-ss_defconfig
        
        # 开启 KSU
        ./scripts/config --file out/.config \
          --enable CONFIG_KSU \
          --enable CONFIG_KSU_MANUAL_HOOK \
          --enable CONFIG_MODULES \
          --disable CONFIG_KSU_USE_KPROBES \
          --disable CONFIG_KPROBES \
          --disable CONFIG_KPROBE_EVENTS \
          --disable CONFIG_HAVE_KPROBES

        make O=out olddefconfig

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=coolapk@sanba
        export KBUILD_BUILD_USER=GitHub@sanba0519

        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld \
          Image.gz-dtb 2>&1 | tee build.log || { tail -n 100 build.log; exit 1; }

    - name: 制作 AnyKernel3 卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' anykernel.sh
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=0;/g' anykernel.sh
        sed -i '/cmdline=/a cmdline="androidboot.selinux=permissive"' anykernel.sh
        
        if [ -f "../android-kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
        elif [ -f "../android-kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz Image.gz
        else
            echo "ERROR: Kernel image not found!"
            exit 1
        fi
        rm -rf .git* README.md .github

    - name: 上传 AnyKernel3 卡刷包
      uses: actions/upload-artifact@v4
      with:
        name: OPPO-K7x-MT6853-KSU-AnyKernel3
        path: kernel_workspace/AnyKernel3/*