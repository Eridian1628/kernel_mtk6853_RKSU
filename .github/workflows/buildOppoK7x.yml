name: Build(rsuntk KSU legacy + Hooks) Oppo K7x MT6853

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 构建编译内核环境
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex \
          libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
          python3 python-is-python3 binutils binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5 libncursesw5-dev rsync patch

    - name: 下载 GCC 工具链 (Google 4.9)
      run: |
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace && cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc64 gcc32
        wget -qO gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -xzf gcc-aarch64.tar.gz -C gcc64/
        wget -qO gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -xzf gcc-arm.tar.gz -C gcc32/

    - name: 下载 Clang 工具链 (crDroid clang-10)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/wu17481748/android_kernel_mtk6853 android-kernel

    - name: 集成 rsuntk KernelSU 并注入钩子
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        # 1. 彻底清理
        rm -rf drivers/kernelsu KernelSU drivers/ksu_core KernelSU_Tmp
        sed -i '/kernelsu/d;/ksu_core/d;/KSU/d' drivers/Kconfig drivers/Makefile || true
        
        # 2. 克隆 Legacy 分支
        git clone --depth=1 https://github.com/rsuntk/KernelSU KernelSU_Tmp -b v3.0.0-30-legacy || { echo "克隆失败"; exit 1; }
        
        # 3. 物理扁平化（递归拷贝所有文件，兼容任意结构）
        mkdir -p drivers/ksu_core
        cp -r KernelSU_Tmp/* drivers/ksu_core/ || { echo "拷贝失败，请检查仓库结构"; exit 1; }
        rm -rf KernelSU_Tmp
        
        # 4. 自动检测函数名前缀（多关键词判断）
        cd drivers/ksu_core
        if grep -q -e "rksu_handle_execveat" -e "rksu_handle_" *.c *.h 2>/dev/null; then
          KSU_PREFIX="rksu"
        elif grep -q -e "ksu_handle_execveat" -e "ksu_handle_" *.c *.h 2>/dev/null; then
          KSU_PREFIX="ksu"
        else
          KSU_PREFIX="ksu"
          echo "WARNING: 未检测到 handle_ 前缀，使用默认 ksu_"
        fi
        cd ../../
        echo "检测到的 KSU 前缀：${KSU_PREFIX}_handle_"
        
        # 5. 强制重写 ksu_core/Makefile（确保能编译）
        if [ -f "drivers/ksu_core/kernelsu.c" ]; then
          echo "obj-y += kernelsu.o" > drivers/ksu_core/Makefile
        else
          echo "obj-y += ksu.o" > drivers/ksu_core/Makefile
        fi
        echo "ccflags-y += -I\$(srctree)/drivers/ksu_core" >> drivers/ksu_core/Makefile
        
        # 6. 注入 Kconfig 和 Makefile（顶级）
        sed -i '1i source "drivers/ksu_core/Kconfig"' drivers/Kconfig
        sed -i '1i obj-y += ksu_core/' drivers/Makefile
        
        # 7. 处理编码 + 清理旧痕迹
        find drivers/ksu_core -type f -exec dos2unix {} \; || true
        sed -i "/${KSU_PREFIX}_handle/d" fs/*.c kernel/*.c || true
        sed -i "/ksu_handle/d;/rksu_handle/d" fs/*.c kernel/*.c || true
        
        # 8. 注入钩子（动态前缀）
        # execveat
        sed -i "1i #ifdef CONFIG_KSU\nextern int ${KSU_PREFIX}_handle_execveat(int *fd, struct filename **filename, void *argv, void *envp, int *flags);\n#endif" fs/exec.c || true
        sed -i "/do_execveat_common/,/{/ s/{/{\n#ifdef CONFIG_KSU\n    ${KSU_PREFIX}_handle_execveat(\&fd, \&filename, \&argv, \&envp, \&flags);\n#endif/" fs/exec.c || true
        
        # faccessat
        sed -i "1i #ifdef CONFIG_KSU\nextern int ${KSU_PREFIX}_handle_faccessat(int *dfd, const char __user **filename, int *mode, int *flags);\n#endif" fs/open.c || true
        sed -i "/sys_faccessat/,/{/ s/{/{\n#ifdef CONFIG_KSU\n    if (${KSU_PREFIX}_handle_faccessat(\&dfd, \&filename, \&mode, \&flags)) return -EACCES;\n#endif/" fs/open.c || true
        
        # stat
        sed -i "1i #ifdef CONFIG_KSU\nextern int ${KSU_PREFIX}_handle_stat(int *dfd, const char __user **filename, int *flags);\nextern int ${KSU_PREFIX}_handle_newfstatat(int dfd, const char __user *filename, struct stat *statbuf, int flag);\n#endif" fs/stat.c || true
        sed -i "/vfs_fstatat/,/{/ s/{/{\n#ifdef CONFIG_KSU\n    ${KSU_PREFIX}_handle_stat(\&dfd, \&filename, \&flags);\n#endif/" fs/stat.c || true
        sed -i "/__do_sys_newfstatat/,/{/ s/{/{\n#ifdef CONFIG_KSU\n    if (${KSU_PREFIX}_handle_newfstatat(dfd, filename, statbuf, flag)) return -EACCES;\n#endif/" fs/stat.c || true
        
        # reboot
        sed -i "1i #ifdef CONFIG_KSU\nextern int ${KSU_PREFIX}_handle_reboot(int magic1, int magic2, unsigned int cmd, void __user *arg);\n#endif" kernel/reboot.c || true
        sed -i "/SYSCALL_DEFINE4(reboot/,/{/ s/{/{\n#ifdef CONFIG_KSU\n    ${KSU_PREFIX}_handle_reboot(magic1, magic2, cmd, arg);\n#endif/" kernel/reboot.c || true
        
        # 9. 最终验证（看这里！）
        echo "=== 最终验证 ==="
        echo "KSU 前缀：${KSU_PREFIX}"
        grep -r "${KSU_PREFIX}_handle" fs/ kernel/ || echo "未找到注入！"
        ls -l drivers/ksu_core/*.c drivers/ksu_core/*.h || echo "源码文件缺失！"
        head -n 5 drivers/ksu_core/Makefile

    - name: 设置 ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: mtk6853-ksu-v3-legacy
        max-size: 3G

    - name: 配置内核并开启 KSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        make O=out mt6853-ss_defconfig
        
        # 开启 KSU
        ./scripts/config --file out/.config \
          --enable CONFIG_KSU \
          --enable CONFIG_KSU_MANUAL_HOOK \
          --enable CONFIG_MODULES \
          --disable CONFIG_KSU_USE_KPROBES \
          --disable CONFIG_KPROBES \
          --disable CONFIG_KPROBE_EVENTS \
          --disable CONFIG_HAVE_KPROBES

        make O=out olddefconfig

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=coolapk@sanba
        export KBUILD_BUILD_USER=GitHub@sanba0519

        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld \
          Image.gz-dtb 2>&1 | tee build.log || { tail -n 100 build.log; exit 1; }

    - name: 制作 AnyKernel3 卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/by-name/boot;|g' anykernel.sh
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=0;/g' anykernel.sh
        sed -i '/cmdline=/a cmdline="androidboot.selinux=permissive"' anykernel.sh
        
        if [ -f "../android-kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
        elif [ -f "../android-kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz Image.gz
        else
            echo "ERROR: Kernel image not found!"
            exit 1
        fi
        rm -rf .git* README.md .github

    - name: 上传 AnyKernel3 卡刷包
      uses: actions/upload-artifact@v4
      with:
        name: OPPO-K7x-MT6853-KSU-AnyKernel3
        path: kernel_workspace/AnyKernel3/*