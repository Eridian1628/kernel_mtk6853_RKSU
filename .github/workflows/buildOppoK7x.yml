name: Build(rsuntk KSU legacy + Hooks) Oppo K7x MT6853

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5' # 每周五凌晨运行一次

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 构建编译内核环境
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          git make bc bison ccache openssl dos2unix zip unzip kmod cpio flex \
          libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
          python3 python-is-python3 binutils binutils-aarch64-linux-gnu \
          binutils-arm-linux-gnueabi gcc-multilib g++-multilib libc6-dev-i386 \
          libncurses5 libncursesw5-dev rsync patch

    - name: 下载 GCC 工具链 (Google 4.9)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace || mkdir -p $GITHUB_WORKSPACE/kernel_workspace && cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc64 gcc32
        wget -qO gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc64/ -xzf gcc-aarch64.tar.gz
        wget -qO gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc32/ -xzf gcc-arm.tar.gz

    - name: 下载 Clang 工具链 (crDroid clang-10)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/wu17481748/android_kernel_mtk6853 android-kernel
        cd android-kernel

    - name: 集成 rsuntk KernelSU (legacy v1.0.5-83 稳定版)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf KernelSU
        # 用 rsuntk fork 的 setup.sh + 指定 legacy tag（兼容 4.14 manual hook）
        curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s v3.0.0-30-legacy

    - name: 设置 ccache 缓存
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: mtk6853-ksu-nethunter-${{ github.sha }}
        max-size: 3G

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_HOST=企鹅交流:722651738
        export KBUILD_BUILD_USER=kuan-jsbsbxjxh66

        make -s -j$(nproc --all) O=out mt6853-ss_defconfig
        make -j$(nproc --all) O=out \
          CC="ccache clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld \
          Image.gz-dtb 2>&1 | tee build.log || { tail -n 100 build.log; exit 1; }

    - name: 制作 AnyKernel3 卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
        echo 'cmdline+=" androidboot.selinux=permissive"' >> anykernel.sh  # 兼容 SELinux
        cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
        rm -rf .git* README.md .github  # 清理多余文件

    - name: 上传 AnyKernel3 卡刷包
      uses: actions/upload-artifact@v4
      with:
        name: OPPO-Realme-MT6853-KSU-AnyKernel3
        path: kernel_workspace/AnyKernel3/*

    - name: 上传原始 Image.gz-dtb
      uses: actions/upload-artifact@v4
      with:
        name: MT6853-Image.gz-dtb
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb